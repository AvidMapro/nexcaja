<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexCaja — Caja</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);--text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);--text-lg:clamp(1.25rem,1.1rem + .75vw,1.75rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --bg:#0a0e1a;--surface:#111827;--surface-2:#1c2333;--surface-off:#161d2e;
  --surface-dyn:#2a3347;--divider:#1e2a3d;--border:#2e3a52;
  --text:#e2e8f4;--text-muted:#7a8aa8;--text-faint:#3a4a62;
  --primary:#3b82f6;--primary-h:#2563eb;--primary-hl:#1e3a5f;
  --success:#22c55e;--success-hl:#14532d;--error:#ef4444;--error-hl:#450a0a;
  --warning:#f59e0b;--warning-hl:#451a03;
}
[data-theme="light"]{
  --bg:#f0f4f8;--surface:#fff;--surface-2:#f8fafc;--surface-off:#f1f5f9;
  --surface-dyn:#e2e8f0;--divider:#e2e8f0;--border:#cbd5e1;
  --text:#1e293b;--text-muted:#64748b;--text-faint:#94a3b8;
  --primary:#2563eb;--primary-h:#1d4ed8;--primary-hl:#dbeafe;
  --success:#16a34a;--success-hl:#dcfce7;--error:#dc2626;--error-hl:#fee2e2;
  --warning:#d97706;--warning-hl:#fef3c7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;height:100%}
body{height:100%;font-family:'Inter',sans-serif;font-size:var(--text-sm);color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input{font:inherit;color:inherit}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 var(--space-5);height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:var(--space-3)}
.logo-chip{display:flex;align-items:center;gap:var(--space-2);font-weight:800;font-size:var(--text-base);letter-spacing:-.02em}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}
.cajero-badge{font-size:var(--text-xs);color:var(--text-muted);background:var(--surface-off);border:1px solid var(--border);border-radius:var(--radius-full);padding:3px 10px}
.topbar-right{display:flex;align-items:center;gap:var(--space-3)}
.topbar-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:600;color:var(--text-muted);border:1px solid var(--border);background:var(--surface-off);transition:all var(--transition)}
.topbar-btn:hover{color:var(--text);background:var(--surface-dyn)}
.topbar-btn.danger:hover{color:var(--error);border-color:var(--error)}

/* MAIN LAYOUT */
.main{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden}

/* PANEL IZQUIERDO: productos */
.panel-productos{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.productos-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:var(--space-3);flex-shrink:0}
.search-wrap{position:relative}
.search-input{width:100%;background:var(--surface-off);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-3) var(--space-3) 36px;font-size:var(--text-sm);color:var(--text);transition:all var(--transition)}
.search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 15%,transparent)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.cat-tabs{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:2px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:5px 14px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;color:var(--text-muted);background:var(--surface-off);border:1px solid var(--border);white-space:nowrap;transition:all var(--transition)}
.cat-tab.active{background:var(--primary-hl);color:var(--primary);border-color:var(--primary)}
.productos-grid{flex:1;overflow-y:auto;padding:var(--space-4);display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-3);align-content:start}
.productos-grid::-webkit-scrollbar{width:4px}
.productos-grid::-webkit-scrollbar-track{background:transparent}
.productos-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.producto-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:all var(--transition);display:flex;flex-direction:column;gap:var(--space-2)}
.producto-card:hover{border-color:var(--primary);background:var(--surface-2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.producto-card:active{transform:translateY(0)}
.producto-card.sin-stock{opacity:.45;cursor:not-allowed}
.prod-emoji{font-size:2rem;line-height:1;margin-bottom:var(--space-1)}
.prod-nombre{font-size:var(--text-xs);font-weight:600;line-height:1.3;color:var(--text)}
.prod-precio{font-size:var(--text-sm);font-weight:800;color:var(--primary)}
.prod-stock{font-size:10px;color:var(--text-faint)}
.prod-stock.bajo{color:var(--warning)}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-8);color:var(--text-faint);gap:var(--space-3);text-align:center}
.loading-state{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:var(--space-8);gap:var(--space-3);color:var(--text-muted)}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* PANEL DERECHO: carrito */
.panel-carrito{display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.carrito-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.carrito-title{font-weight:700;font-size:var(--text-base)}
.carrito-count{background:var(--primary);color:white;border-radius:var(--radius-full);width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.btn-limpiar{font-size:var(--text-xs);color:var(--text-faint);padding:4px 8px;border-radius:var(--radius-md);transition:all var(--transition)}
.btn-limpiar:hover{color:var(--error);background:var(--error-hl)}

.carrito-items{flex:1;overflow-y:auto;padding:var(--space-3)}
.carrito-items::-webkit-scrollbar{width:4px}
.carrito-items::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.carrito-vacio{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:var(--space-3);color:var(--text-faint);text-align:center;padding:var(--space-8)}

.item-carrito{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-lg);background:var(--surface-off);border:1px solid var(--border);margin-bottom:var(--space-2);animation:itemIn .2s ease}
@keyframes itemIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.item-info{flex:1;min-width:0}
.item-nombre{font-size:var(--text-xs);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-precio{font-size:11px;color:var(--text-muted)}
.item-controles{display:flex;align-items:center;gap:6px}
.ctrl-btn{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--surface-dyn);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.ctrl-btn:hover{background:var(--primary);color:white}
.ctrl-qty{font-size:var(--text-xs);font-weight:700;min-width:20px;text-align:center}
.item-subtotal{font-size:var(--text-xs);font-weight:700;color:var(--primary);min-width:44px;text-align:right}

.carrito-footer{border-top:1px solid var(--border);padding:var(--space-4) var(--space-5);flex-shrink:0}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)}
.total-label{font-size:var(--text-xs);color:var(--text-muted)}
.total-amount{font-size:var(--text-lg);font-weight:800;color:var(--text)}
.pago-tabs{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-4)}
.pago-tab{padding:var(--space-3);border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:600;color:var(--text-muted);background:var(--surface-off);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;transition:all var(--transition)}
.pago-tab.active{background:var(--primary-hl);color:var(--primary);border-color:var(--primary)}
.monto-input-wrap{margin-bottom:var(--space-4);display:none}
.monto-input-wrap.show{display:block}
.monto-label{font-size:var(--text-xs);color:var(--text-muted);margin-bottom:var(--space-2)}
.monto-input{width:100%;background:var(--surface-off);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-base);font-weight:700;color:var(--text);text-align:right;transition:all var(--transition)}
.monto-input:focus{outline:none;border-color:var(--primary)}
.vuelto-badge{background:var(--success-hl);border:1px solid color-mix(in oklch,var(--success) 30%,transparent);color:var(--success);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:var(--text-xs);font-weight:700;display:none;margin-bottom:var(--space-3);text-align:center}
.vuelto-badge.show{display:block}
.cobrar-btn{width:100%;padding:var(--space-4);border-radius:var(--radius-lg);background:var(--success);color:white;font-size:var(--text-sm);font-weight:800;display:flex;align-items:center;justify-content:center;gap:var(--space-2);transition:all var(--transition);box-shadow:0 4px 16px color-mix(in oklch,var(--success) 30%,transparent)}
.cobrar-btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
.cobrar-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* MODOS: voz y cámara */
.mode-strip{padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--border);display:flex;gap:var(--space-2);flex-shrink:0}
.mode-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;color:var(--text-muted);background:var(--surface-off);border:1px solid var(--border);transition:all var(--transition)}
.mode-btn.active{background:var(--primary-hl);color:var(--primary);border-color:var(--primary)}
.mode-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* MODAL ÉXITO */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--space-8);width:90%;max-width:360px;text-align:center;transform:scale(.9);transition:transform .3s}
.modal-overlay.show .modal{transform:scale(1)}
.modal-icon{font-size:3rem;margin-bottom:var(--space-4)}
.modal-title{font-size:var(--text-lg);font-weight:800;margin-bottom:var(--space-2)}
.modal-detail{font-size:var(--text-xs);color:var(--text-muted);margin-bottom:var(--space-6)}
.modal-id{font-family:'JetBrains Mono',monospace;font-size:var(--text-xs);background:var(--surface-off);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);display:inline-block;margin-bottom:var(--space-5)}
.modal-btn{padding:var(--space-3) var(--space-8);border-radius:var(--radius-lg);background:var(--primary);color:white;font-weight:700;font-size:var(--text-sm);transition:all var(--transition)}
.modal-btn:hover{background:var(--primary-h)}

/* TOAST */
.toast{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%) translateY(80px);background:var(--error);color:white;padding:var(--space-3) var(--space-5);border-radius:var(--radius-lg);font-size:var(--text-xs);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .3s ease;z-index:200;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo-chip">
      <span class="logo-dot"></span>
      NexCaja
    </div>
    <span class="cajero-badge" id="cajeroNombre">Cargando...</span>
  </div>
  <div class="topbar-right">
    <button class="topbar-btn" onclick="recargarProductos()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Recargar
    </button>
    <button class="topbar-btn" onclick="window.location.href='dashboard.html'">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
    <button class="topbar-btn danger" onclick="NexCajaAPI.cerrarSesion()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Salir
    </button>
  </div>
</header>

<!-- STRIP DE MODOS -->
<div class="mode-strip">
  <button class="mode-btn active" id="modeManual" onclick="setMode('manual')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Manual
  </button>
  <button class="mode-btn" id="modeVoz" onclick="toggleVoz()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    <span class="dot" style="display:none" id="vozDot"></span>
    Voz
  </button>
  <button class="mode-btn" id="modeCamara" onclick="toggleCamara()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    Cámara
  </button>
</div>

<!-- MAIN -->
<div class="main">
  <!-- PANEL PRODUCTOS -->
  <div class="panel-productos">
    <div class="productos-header">
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar producto..." oninput="filtrarProductos(this.value)">
      </div>
      <div class="cat-tabs">
        <button class="cat-tab active" onclick="filtrarCategoria(this,'todos')">Todos</button>
        <button class="cat-tab" onclick="filtrarCategoria(this,'PERECIBLE')">🍞 Perecibles</button>
        <button class="cat-tab" onclick="filtrarCategoria(this,'BEBIDA')">🥤 Bebidas</button>
        <button class="cat-tab" onclick="filtrarCategoria(this,'NO_PERECIBLE')">🛍️ No perecibles</button>
      </div>
    </div>
    <div class="productos-grid" id="productosGrid">
      <div class="loading-state">
        <svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Cargando catálogo...
      </div>
    </div>
  </div>

  <!-- PANEL CARRITO -->
  <div class="panel-carrito">
    <div class="carrito-header">
      <div style="display:flex;align-items:center;gap:var(--space-2)">
        <span class="carrito-title">Carrito</span>
        <span class="carrito-count" id="carritoCount">0</span>
      </div>
      <button class="btn-limpiar" onclick="limpiarCarrito()">Limpiar</button>
    </div>

    <div class="carrito-items" id="carritoItems">
      <div class="carrito-vacio">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span style="font-size:var(--text-xs);opacity:.5">Selecciona productos del catálogo</span>
      </div>
    </div>

    <div class="carrito-footer">
      <div class="total-row">
        <span class="total-label">TOTAL</span>
        <span class="total-amount" id="totalAmount">$0.00</span>
      </div>

      <div class="pago-tabs">
        <button class="pago-tab active" id="tabEfectivo" onclick="setMetodoPago('EFECTIVO')">
          💵 Efectivo
        </button>
        <button class="pago-tab" id="tabTarjeta" onclick="setMetodoPago('TARJETA')">
          💳 Tarjeta
        </button>
      </div>

      <div class="monto-input-wrap show" id="montoWrap">
        <div class="monto-label">Monto recibido</div>
        <input type="number" class="monto-input" id="montoInput" placeholder="0.00" step="0.01" oninput="calcularVuelto()">
      </div>

      <div class="vuelto-badge" id="vueltoBadge"></div>

      <button class="cobrar-btn" id="cobrarBtn" onclick="procesarVenta()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Cobrar
      </button>
    </div>
  </div>
</div>

<!-- MODAL ÉXITO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">✅</div>
    <div class="modal-title">Venta registrada</div>
    <div class="modal-detail" id="modalDetail"></div>
    <div class="modal-id" id="modalId"></div>
    <button class="modal-btn" onclick="cerrarModal()">Nueva venta</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script>
// ===================================================
// ESTADO GLOBAL
// ===================================================
let todosProductos = [];   // Catálogo completo del backend
let productosFiltrados = []; // Vista actual (filtrado por búsqueda/categoría)
let carrito = [];          // Items en el carrito [{producto, cantidad}]
let metodoPago = 'EFECTIVO';
let categoriaActiva = 'todos';
let vozActiva = false;
let recognition = null;

// ===================================================
// INIT
// ===================================================
window.addEventListener('DOMContentLoaded', () => {
  // Mostrar nombre del cajero
  const u = NexCajaAPI.getUsuarioActual();
  document.getElementById('cajeroNombre').textContent = u
    ? `${u.nombre} ${u.apellido} · ${u.rol}`
    : 'Sin sesión';

  // Cargar catálogo de productos
  cargarProductos();
});

// ===================================================
// PRODUCTOS — carga desde el backend
// ===================================================
async function cargarProductos() {
  const grid = document.getElementById('productosGrid');
  grid.innerHTML = `<div class="loading-state"><svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Cargando catálogo...</div>`;
  try {
    todosProductos = await NexCajaAPI.getProductos();
    productosFiltrados = todosProductos;
    renderProductos();
  } catch {
    // Modo demo: productos de muestra si el backend no está
    todosProductos = getProductosDemo();
    productosFiltrados = todosProductos;
    renderProductos();
    showToast('⚠️ Modo demo — backend no disponible', false);
  }
}

function recargarProductos() { cargarProductos(); }

const EMOJIS = {
  PERECIBLE: ['🍞','🥐','🧀','🥚','🍖'],
  BEBIDA:    ['🥤','🧃','🍶','🥛','🍵'],
  NO_PERECIBLE: ['🍫','🍬','🥫','🛍️','🍪']
};
function emojiProducto(p) {
  const arr = EMOJIS[p.categoria] || ['📦'];
  return arr[p.id % arr.length] || arr[0];
}

function renderProductos() {
  const grid = document.getElementById('productosGrid');
  if (!productosFiltrados.length) {
    grid.innerHTML = `<div class="empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Sin resultados</span></div>`;
    return;
  }
  grid.innerHTML = productosFiltrados.map(p => `
    <div class="producto-card${p.stock === 0 ? ' sin-stock' : ''}" onclick="agregarAlCarrito(${p.id})">
      <div class="prod-emoji">${emojiProducto(p)}</div>
      <div class="prod-nombre">${p.nombre}</div>
      <div class="prod-precio">$${p.precio.toFixed(2)}</div>
      <div class="prod-stock${p.stock <= 5 ? ' bajo' : ''}">${p.stock > 0 ? `Stock: ${p.stock}` : 'Sin stock'}</div>
    </div>`).join('');
}

function filtrarProductos(q) {
  const txt = q.toLowerCase();
  productosFiltrados = todosProductos.filter(p =>
    p.nombre.toLowerCase().includes(txt) &&
    (categoriaActiva === 'todos' || p.categoria === categoriaActiva)
  );
  renderProductos();
}

function filtrarCategoria(btn, cat) {
  categoriaActiva = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtrarProductos(document.getElementById('searchInput').value);
}

// ===================================================
// CARRITO
// ===================================================
function agregarAlCarrito(productoId) {
  const prod = todosProductos.find(p => p.id === productoId);
  if (!prod || prod.stock === 0) return;
  const existe = carrito.find(i => i.producto.id === productoId);
  if (existe) {
    if (existe.cantidad >= prod.stock) { showToast('Stock máximo alcanzado'); return; }
    existe.cantidad++;
  } else {
    carrito.push({ producto: prod, cantidad: 1 });
  }
  renderCarrito();
}

function cambiarCantidad(productoId, delta) {
  const idx = carrito.findIndex(i => i.producto.id === productoId);
  if (idx === -1) return;
  carrito[idx].cantidad += delta;
  if (carrito[idx].cantidad <= 0) carrito.splice(idx, 1);
  renderCarrito();
}

function limpiarCarrito() {
  carrito = [];
  renderCarrito();
}

function renderCarrito() {
  const container = document.getElementById('carritoItems');
  document.getElementById('carritoCount').textContent = carrito.reduce((s, i) => s + i.cantidad, 0);

  if (!carrito.length) {
    container.innerHTML = `<div class="carrito-vacio">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span style="font-size:var(--text-xs);opacity:.5">Selecciona productos del catálogo</span></div>`;
  } else {
    container.innerHTML = carrito.map(i => `
      <div class="item-carrito">
        <div class="item-info">
          <div class="item-nombre">${i.producto.nombre}</div>
          <div class="item-precio">$${i.producto.precio.toFixed(2)} c/u</div>
        </div>
        <div class="item-controles">
          <button class="ctrl-btn" onclick="cambiarCantidad(${i.producto.id},-1)">−</button>
          <span class="ctrl-qty">${i.cantidad}</span>
          <button class="ctrl-btn" onclick="cambiarCantidad(${i.producto.id},+1)">+</button>
        </div>
        <div class="item-subtotal">$${(i.producto.precio * i.cantidad).toFixed(2)}</div>
      </div>`).join('');
  }

  const total = carrito.reduce((s, i) => s + i.producto.precio * i.cantidad, 0);
  document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
  document.getElementById('cobrarBtn').disabled = carrito.length === 0;
  calcularVuelto();
}

// ===================================================
// PAGO
// ===================================================
function setMetodoPago(mp) {
  metodoPago = mp;
  document.getElementById('tabEfectivo').classList.toggle('active', mp === 'EFECTIVO');
  document.getElementById('tabTarjeta').classList.toggle('active', mp === 'TARJETA');
  document.getElementById('montoWrap').classList.toggle('show', mp === 'EFECTIVO');
  if (mp === 'TARJETA') document.getElementById('vueltoBadge').classList.remove('show');
}

function calcularVuelto() {
  const total  = carrito.reduce((s, i) => s + i.producto.precio * i.cantidad, 0);
  const monto  = parseFloat(document.getElementById('montoInput').value) || 0;
  const badge  = document.getElementById('vueltoBadge');
  if (metodoPago === 'EFECTIVO' && monto >= total && total > 0) {
    badge.textContent = `Vuelto: $${(monto - total).toFixed(2)}`;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

// ===================================================
// COBRAR — llama al backend real
// ===================================================
async function procesarVenta() {
  if (!carrito.length) return;
  const total  = carrito.reduce((s, i) => s + i.producto.precio * i.cantidad, 0);
  const monto  = parseFloat(document.getElementById('montoInput').value) || total;

  if (metodoPago === 'EFECTIVO' && monto < total) {
    showToast('El monto recibido es insuficiente');
    return;
  }

  const btn = document.getElementById('cobrarBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Procesando...';

  try {
    const venta = {
      metodoPago,
      montoPagado: metodoPago === 'EFECTIVO' ? monto : total,
      items: carrito.map(i => ({ productoId: i.producto.id, cantidad: i.cantidad }))
    };
    const resultado = await NexCajaAPI.registrarVenta(venta);

    // Actualizar stock local
    carrito.forEach(i => {
      const prod = todosProductos.find(p => p.id === i.producto.id);
      if (prod) prod.stock -= i.cantidad;
    });

    // Mostrar modal de éxito
    document.getElementById('modalDetail').textContent =
      `Total: $${total.toFixed(2)} · ${metodoPago}${resultado.vuelto > 0 ? ' · Vuelto: $' + resultado.vuelto.toFixed(2) : ''}`;
    document.getElementById('modalId').textContent = `TX #${resultado.id || Date.now()}`;
    document.getElementById('modalOverlay').classList.add('show');
    limpiarCarrito();

  } catch (err) {
    // Modo demo si el backend no está
    document.getElementById('modalDetail').textContent =
      `Total: $${total.toFixed(2)} · ${metodoPago} (modo demo)`;
    document.getElementById('modalId').textContent = `TX #DEMO-${Date.now()}`;
    document.getElementById('modalOverlay').classList.add('show');
    limpiarCarrito();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Cobrar';
  }
}

function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  renderProductos();
}

// ===================================================
// MODOS: VOZ
// ===================================================
function setMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
}

function toggleVoz() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    showToast('Tu navegador no soporta reconocimiento de voz');
    return;
  }
  if (vozActiva) {
    recognition && recognition.stop();
    vozActiva = false;
    document.getElementById('modeVoz').classList.remove('active');
    document.getElementById('vozDot').style.display = 'none';
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'es-EC';
  recognition.continuous = false;
  recognition.onresult = e => {
    const texto = e.results[0][0].transcript.toLowerCase();
    procesarComandoVoz(texto);
  };
  recognition.onend = () => {
    vozActiva = false;
    document.getElementById('modeVoz').classList.remove('active');
    document.getElementById('vozDot').style.display = 'none';
  };
  recognition.start();
  vozActiva = true;
  document.getElementById('modeVoz').classList.add('active');
  document.getElementById('vozDot').style.display = 'inline-block';
  setMode('voz');
}

function procesarComandoVoz(texto) {
  const nums = {'un':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10};
  let cantidad = 1;
  for (const [w, n] of Object.entries(nums)) {
    if (texto.includes(w)) { cantidad = n; break; }
  }
  const match = todosProductos.find(p => texto.includes(p.nombre.toLowerCase().split(' ')[0]));
  if (match) {
    for (let i = 0; i < cantidad; i++) agregarAlCarrito(match.id);
    showToast(`✅ ${cantidad}x ${match.nombre}`, true);
  } else {
    showToast(`No encontré: "${texto}"`);
  }
}

function toggleCamara() {
  showToast('📸 Módulo de cámara en desarrollo (JavaCV + YOLO)', true);
  setMode('camara');
}

// ===================================================
// UTILIDADES

function showToast(msg, ok = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (ok ? ' ok' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
